name: CI

# Gates main and every pull request. Vercel deploys from main, so a failure
# here is what should stop a bad build reaching the site — see the branch
# protection note in README.md; the workflow reports, the setting enforces.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pipeline only runs when the dataset is regenerated, so check it here
  # rather than waiting for the next rebuild to find out. The validation step
  # gates the committed public/dataset.json itself: duplicate records, series
  # alignment, finite values, percentage ranges, and provenance that matches
  # sources.lock.json.
  data-pipeline:
    name: data pipeline · dataset validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: python -m pip install -r requirements-dev.txt

      - name: Validate dataset
        run: python validate_dataset.py

      - name: Pipeline tests
        run: python -m pytest tests

  verify:
    name: lint · types · build · browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      # The browser tests serve dist/ through `astro preview`, so the build
      # has to land before they run.
      - name: Build
        run: npm run build

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm test

      # Kept on success too: the report names any test that needed its retry,
      # which is how a flake gets noticed instead of quietly passing.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
